<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Form</title>

<style>

body{
    font-family: Arial;
     background: rgba(247, 247, 160, 0.733);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container{
    background: white;
    width: 400px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
}

h2{
    text-align: center;
}

input, select{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button{
    width: 100%;
    padding: 12px;
    background: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover{
    background: darkgreen;
}

.total{
    font-size: 20px;
    color: blue;
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
}

#cardDetails{
    display: none;
}
header{
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    color: rgb(0, 0, 0);
    box-shadow: 1px 5px 4px black;
}
.logo img{
    width: 150px;
    height: 160px;
    border-radius: 35%;
    
}
</style>
</head>

<body>
  <header>
        
        <div class="logo">
            <img src="kk collections logo.png" alt="">
        </div>
        <h2>KK COLLECTIONS G7</h2>
    </header>
<div class="container">

    <h2>Payment Form</h2>

    <form id="paymentForm">

        <label>Product Name</label>
        <input type="text" id="product" required>

        <label>Price Per Item</label>
        <input type="number" id="price" required onkeyup="calculateTotal()">

        <label>Quantity</label>
        <input type="number" id="quantity" required onkeyup="calculateTotal()">

        <div class="total">
            Total Amount:   UGX<span id="total">0</span>
        </div>

        <label>Select Payment Method</label>
        <select id="paymentMethod" onchange="showFields()">
            <option value="MTN">MTN Mobile Money</option>
            <option value="Airtel">Airtel Money</option>
            <option value="Card">Credit Card</option>
        </select>

        <div id="mobileMoney">

            <label>Phone Number</label>
            <input type="text" id="phone">

        </div>

        <div id="cardDetails">

            <label>Card Number</label>
            <input type="text">

            <label>Expiry Date</label>
            <input type="text" placeholder="MM/YY">

            <label>CVV</label>
            <input type="password">

        </div>

        <button type="submit">Pay Now</button>

    </form>

</div>

<script>

function calculateTotal(){

    let price = document.getElementById("price").value;
    let quantity = document.getElementById("quantity").value;

    let total = price * quantity;

    if(!isNaN(total)){
        document.getElementById("total").innerHTML = total;
    }
}

function showFields(){

    let method = document.getElementById("paymentMethod").value;

    if(method === "Card"){
        document.getElementById("cardDetails").style.display = "block";
        document.getElementById("mobileMoney").style.display = "none";
    }
    else{
        document.getElementById("cardDetails").style.display = "none";
        document.getElementById("mobileMoney").style.display = "block";
    }
}

document.getElementById("paymentForm").addEventListener("submit", function(e){

    e.preventDefault();

    alert("Payment Successful!");

});

</script>

</body>
</html>
